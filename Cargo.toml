[package]
name = "calcx"
version = "0.1.0"
edition = "2024"

[features]
default = []
clipboard = ["dep:cli-clipboard"]

[dependencies]
cli-clipboard = { version = "0.4.0", optional=true }
rustyline = { version = "19", default-features = false, features = ["with-file-history"] }
calcx_core = { path="./calcx_core/" }
colored-print = "1.0"
